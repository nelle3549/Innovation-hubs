const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const S={t:'',cat:'',cov:'',region:'',};

// ---------- filtering ----------
function match(d, skip){
  const q=($('q').value||'').toLowerCase();
  if(skip!=='t'   && S.t      && d.t!==S.t) return false;
  if(skip!=='cat' && S.cat    && d.cat!==S.cat) return false;
  if(skip!=='cov' && S.cov    && d.coverage!==S.cov) return false;
  if(skip!=='region' && S.region && d.region!==S.region) return false;
  if(q && d.key.indexOf(q)<0) return false;
  return true;
}
const count=(pred,skip)=>DATA.filter(d=>pred(d)&&match(d,skip)).length;

// ---------- hash state ----------
function saveHash(){
  const p=new URLSearchParams();
  for(const k of ['t','cat','cov','region']) if(S[k]) p.set(k,S[k]);
  const q=$('q').value; if(q) p.set('q',q);
  history.replaceState(null,'', p.toString()?('#'+p.toString()):location.pathname);
}
function loadHash(){
  const p=new URLSearchParams(location.hash.slice(1));
  for(const k of ['t','cat','cov','region']) S[k]=p.get(k)||'';
  $('q').value=p.get('q')||'';
  // sanity: cat/cov must belong to the chosen type
  if(S.t!=='Center'&&S.t!=='Opportunity'){S.cat='';S.cov='';}
  if(S.t==='Center')S.cov='';
}

// ---------- chip renderers ----------
function chip(row,val,label,n,sel,dis,onpick){
  const b=document.createElement('button');
  b.className='chipf'+(sel?' sel':''); b.disabled=dis&&!sel;
  b.innerHTML=esc(label)+(n!=null?'<span class="n">'+n+'</span>':'');
  b.onclick=()=>{onpick(sel?'':val);};
  row.appendChild(b);
}
function renderFacets(){
  // TYPE — no "All" chip: re-tapping a selected chip deselects it
  const rT=$('rowT'); rT.innerHTML='';
  for(const [val,label] of [['Center','Centers'],['Opportunity','Opportunities']]){
    const n=count(d=>d.t===val,'t');
    chip(rT,val,label,n,S.t===val,n===0,v=>{S.t=v;S.cat='';S.cov='';if(v!=='Center')S.region='';apply();});
  }
  // CATEGORY (only after a type is chosen)
  const showCat=!!S.t; $('rowCatW').classList.toggle('on',showCat);
  if(showCat){
    const rC=$('rowCat'); rC.innerHTML='';
    const cats=(S.t==='Center'?CEN_CAT:OPP_CAT).filter(c=>DATA.some(d=>d.t===S.t&&d.cat===c));
    for(const c of cats){
      const n=count(d=>d.t===S.t&&d.cat===c,'cat');
      chip(rC,c,c.replace('Technology Business Incubator','TBI').replace('Fabrication Laboratory (FabLab)','FabLab').replace('Food Innovation Center','FIC'),
           n,S.cat===c,n===0,v=>{S.cat=v;apply();});
    }
  } else {S.cat='';}
  // COVERAGE (opportunities only)
  const showCov=S.t==='Opportunity'; $('rowCovW').classList.toggle('on',showCov);
  if(showCov){
    const rV=$('rowCov'); rV.innerHTML='';
    const covs=COV.filter(c=>DATA.some(d=>d.t==='Opportunity'&&d.coverage===c));
    for(const c of covs){
      const n=count(d=>d.t==='Opportunity'&&d.coverage===c,'cov');
      chip(rV,c,c,n,S.cov===c,n===0,v=>{S.cov=v;apply();});
    }
  } else {S.cov='';}
  // REGION (whenever Centers is active — NOT gated on category)
  const showReg=S.t==='Center'; $('rowRegW').classList.toggle('on',showReg);
  if(showReg){
    const sel=$('selReg');
    const regs=REGION.filter(r=>DATA.some(d=>d.t==='Center'&&d.region===r));
    let html='<option value="">All regions ('+count(d=>d.t==='Center','region')+')</option>';
    for(const r of regs){
      const n=count(d=>d.t==='Center'&&d.region===r,'region');
      html+='<option value="'+esc(r)+'"'+(S.region===r?' selected':'')+(n===0&&S.region!==r?' disabled':'')+'>'+esc(r)+' ('+n+')</option>';
    }
    sel.innerHTML=html;
  } else {S.region='';}
}
function clearAll(){S.t=S.cat=S.cov=S.region='';$('q').value='';apply();}

// ---------- results ----------
let cur=null;
function pick(el,url){document.querySelectorAll('.vw-item.active').forEach(a=>a.classList.remove('active'));el.classList.add('active');$('frame').src=url;cur=url;}
function renderList(){
  const rows=DATA.filter(d=>match(d,null));
  const active=S.t||S.cat||S.cov||S.region||$('q').value;
  $('count').innerHTML=(rows.length===DATA.length)
    ? '<strong>'+DATA.length+'</strong>&nbsp;listings'
    : '<strong>'+rows.length+'</strong>&nbsp;of '+DATA.length+' shown';
  $('clear').style.display=active?'inline':'none';
  const groups=[['Innovation Centers',rows.filter(d=>d.t==='Center')],['Opportunities',rows.filter(d=>d.t==='Opportunity')]];
  let html='';
  for(const [g,list] of groups){ if(!list.length) continue;
    list.sort((a,b)=>a.name.localeCompare(b.name));
    html+='<div class="vw-group">'+g+' · '+list.length+'</div>';
    for(const d of list){
      const thumb=d.logo?'<span class="vw-thumb"><img src="'+d.logo+'" alt="" loading="lazy"></span>':'<span class="vw-thumb"></span>';
      html+='<button class="vw-item" data-url="'+d.url+'" title="'+esc(d.name)+'">'+thumb+
            '<span class="vw-text"><span class="vw-name">'+esc(d.name)+'</span><span class="vw-sub">'+esc(d.sub)+'</span></span></button>';
    }
  }
  const nav=$('nav');
  nav.innerHTML=html||'<div class="vw-empty">No matches. Try clearing a filter.</div>';
  nav.querySelectorAll('.vw-item').forEach(el=>{el.addEventListener('click',()=>pick(el,el.dataset.url));if(el.dataset.url===cur)el.classList.add('active');});
  if(!cur){const first=nav.querySelector('.vw-item'); if(first) pick(first,first.dataset.url);}
}
function apply(){renderFacets();renderList();saveHash();}
loadHash();apply();
window.addEventListener('hashchange',()=>{loadHash();apply();});
</script>
</body></html>
